apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
    maintenance.gardener.cloud/operation: "rotate-credentials-start;rotate-ssh-keypair"
spec:
  cloudProfile:
    name: local
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  networking:
    type: calico
    # Must be within 10.0.0.0/16 (subnet of kind pod CIDR 10.0.0.0/15, but disjoint with seed pod CIDR 10.1.0.0/16).
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
    - name: local
      machine:
        type: local
      cri:
        name: containerd
      minimum: 1
      maximum: 2
      maxSurge: 1
      maxUnavailable: 0
  kubernetes:
    version: 1.33.0
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
  maintenance:
    timeWindow:
      begin: 110000+0100
      end: 170000+0100
    autoUpdate:
      kubernetesVersion: true
      machineImageVersion: true
    autoRotation:
      credentials:
        observability:
          enabled: true
          rotationPeriod: 30m
        sshKeypair:
          enabled: true
          rotationPeriod: 168h
        etcdEncryptionKey:
          enabled: true
          rotationPeriod: 168h
